{% load custom_filters %}
<!-- Tarjeta Kanban OT -->
<div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 shadow hover:border-sky-500 transition space-y-2">
    <div class="flex items-center justify-between">
        <span class="text-xs font-mono font-bold text-sky-400">{{ proyecto.codigo_ot }}</span>
        <span class="text-[10px] text-slate-500 font-mono">{{ proyecto.precio_cotizado|clp }}</span>
    </div>
    <div class="text-xs font-semibold text-white truncate">{{ proyecto.nombre_proyecto }}</div>
    <div class="text-[11px] text-slate-400 truncate">{{ proyecto.id_cliente.razon_social }}</div>

    <!-- Cambiar etapa rápido -->
    <form action="{% url 'ordenes_trabajo:proyecto_cambiar_estado' proyecto.pk %}" method="POST" class="pt-2 border-t border-slate-800/80">
        {% csrf_token %}
        <select name="nuevo_estado" onchange="this.form.submit()" class="w-full bg-slate-950 text-[11px] text-slate-300 border border-slate-800 rounded px-2 py-1 focus:outline-none">
            <option value="planificado" {% if proyecto.estado == 'planificado' %}selected{% endif %}>Planificado</option>
            <option value="corte" {% if proyecto.estado == 'corte' %}selected{% endif %}>En Corte</option>
            <option value="armado" {% if proyecto.estado == 'armado' %}selected{% endif %}>En Armado</option>
            <option value="laca_pintura" {% if proyecto.estado == 'laca_pintura' %}selected{% endif %}>Laca y Pintura</option>
            <option value="montaje" {% if proyecto.estado == 'montaje' %}selected{% endif %}>Montaje en Obra</option>
            <option value="entregado" {% if proyecto.estado == 'entregado' %}selected{% endif %}>Entregado Conforme</option>
        </select>
    </form>

    <div class="pt-1 text-right">
        <a href="{% url 'ordenes_trabajo:proyecto_detail' proyecto.pk %}" class="text-[11px] text-sky-400 font-semibold hover:underline">
            Ver Detalle BOM &rarr;
        </a>
    </div>
</div>

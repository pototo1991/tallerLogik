<div id="scraping-progress-container" class="w-full max-w-md bg-red-950/20 border border-red-800/40 p-4 rounded-xl shadow-lg flex items-start space-x-3">
    <div class="flex-shrink-0 bg-red-900/50 p-1.5 rounded-lg text-red-400 border border-red-800/30">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
    </div>
    <div class="flex-1 space-y-1">
        <h4 class="text-sm font-bold text-white leading-tight">Error de Sincronización</h4>
        <p class="text-xs text-slate-400">{{ error }}</p>
        <div class="pt-2">
            <button class="inline-flex items-center px-2.5 py-1 text-xs font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition" onclick="document.getElementById('scraping-progress-container').remove();">
                Cerrar
            </button>
        </div>
    </div>
</div>

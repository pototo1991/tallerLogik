services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-tallerlogik-local-dev-key-change-in-prod
      - ALLOWED_HOSTS=tallerlogik.lisc.cl,localhost,127.0.0.1,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=https://tallerlogik.lisc.cl,http://localhost:8000
      - DB_NAME=tallerlogik_db
      - DB_USER=taller_user
      - DB_PASSWORD=taller_password_secure
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-tallerlogik-local-dev-key-change-in-prod
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DB_NAME=tallerlogik_db
      - DB_USER=taller_user
      - DB_PASSWORD=taller_password_secure
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=tallerlogik_db
      - POSTGRES_USER=taller_user
      - POSTGRES_PASSWORD=taller_password_secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller_user -d tallerlogik_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:


<div id="scraping-progress-container"
     hx-get="{% url 'configuracion_base:scraping_task_status' task_id %}"
     hx-trigger="every 2s"
     hx-swap="outerHTML"
     class="w-full max-w-md bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg space-y-3">
    <div class="flex items-center space-x-3 text-slate-300">
        <svg class="animate-spin h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span class="text-sm font-semibold text-white">Sincronizando con Imperial</span>
    </div>
    <div class="space-y-1">
        <div class="flex justify-between text-xs text-slate-400">
            <span>{{ message }}</span>
            <span class="font-mono">{{ current }}%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
            <div class="bg-[#0284C7] h-full rounded-full transition-all duration-500 ease-out" style="width: {{ current }}%"></div>
        </div>
    </div>
</div>
